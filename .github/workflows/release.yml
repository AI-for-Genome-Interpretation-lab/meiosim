name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: v
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' meiosim/_version.py)
          if [ -z "$VERSION" ]; then
            echo "Could not read __version__ from meiosim/_version.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION exists already — nothing to do."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new — releasing."
          fi

  release:
    needs: check
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # PyPI trusted publishing (OIDC)
      contents: write     # tag + GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      # Last gate before anything irreversible: verify that the artefact about
      # to be uploaded actually imports and carries its bundled data.
      - name: Smoke test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import numpy as np
          import meiosim
          from meiosim import Arabidopsis, MISSING

          print("meiosim", meiosim.__version__)
          pop = Arabidopsis(n_SNPs=200, seed=42)
          assert pop.genotypes.dtype == np.int8
          assert np.isin(pop.genotypes, (0, 1, 2, MISSING)).all()
          print("smoke test OK")
          EOF

      # The tag and the GitHub release come first: both are reversible, and the
      # release event is what triggers the Zenodo deposit. A PyPI upload is
      # final — a version number cannot be reused once taken.
      - name: Create tag + GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --title "v${{ needs.check.outputs.version }}" \
            --generate-notes

      - uses: pypa/gh-action-pypi-publish@release/v1