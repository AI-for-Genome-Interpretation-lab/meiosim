name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      # Run from outside the repository root, otherwise the local source tree
      # shadows the installed package and the test proves nothing about what
      # was actually shipped.
      - name: Smoke test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import numpy as np
          import meiosim
          from meiosim import Arabidopsis, Population, MISSING

          print("meiosim", meiosim.__version__)

          # Loads the bundled HDF5 panel: fails loudly if package-data is missing.
          pop = Arabidopsis(n_SNPs=200, seed=42)
          assert pop.genotypes.dtype == np.int8
          assert np.isin(pop.genotypes, (0, 1, 2, MISSING)).all()

          # Exercise the meiosis path end to end on a handful of parents.
          pop.subset(list(range(4)))
          progeny = pop.cross(selfing=False, n_progeny=2, n_cores=2)
          assert progeny.genotypes.dtype == np.int8
          assert np.isin(progeny.genotypes, (0, 1, 2, MISSING)).all()
          assert len(progeny.metadata) == 12

          # A missing haplotype must propagate rather than overflow int8.
          parents = Population(
              genotypes=np.array([[0, 2, MISSING], [2, 2, 0]], dtype=np.int8),
              metadata=pop.metadata.iloc[:2].reset_index(drop=True).copy(),
              map=pop.map.iloc[:3].reset_index(drop=True).copy(),
              seed=1,
          )
          parents.phasing()
          assert (parents.phases[0][0] == np.array([0, 1, MISSING], dtype=np.int8)).all()

          print("smoke test OK")
          EOF