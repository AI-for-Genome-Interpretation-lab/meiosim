[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meiosim"
version = "0.1.0"
readme = "README.md" 
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "h5py",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meiosim*"]

[tool.setuptools.package-data]
meiosim = ["data/*"]
